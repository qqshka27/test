<title>Кот в колодце</title>
<meta name="description" content="Пошаговый рогалик: спуститесь на дно колодца и спасите кота Барсика от Древнего Пса.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Раскладка: игра на весь экран — HUD сверху, поле в центре, журнал и кнопки снизу.
   Мир игры один — тёмное подземелье при свете фонаря, поэтому тема у страницы одна, тёмная. */
:root {
  --bg: #0d0b10;
  --panel: #17131c;
  --panel-2: #211b28;
  --line: #2f2738;
  --ink: #efe6d8;
  --dim: #9a8fa0;
  --lantern: #ffb347;
  --hp: #d8433c;
  --hp-dim: #4a1d22;
  --xp: #8fd3ff;
  --gold: #ffd34e;
  --good: #7fd36a;
  --bad: #ff7a6b;
  --magic: #c9b3ff;
  --font-display: "Tiny5", "Courier New", monospace;
  --font-body: "PT Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 var(--font-body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; }

/* ---------- HUD ---------- */
.hud {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.depth { font-family: var(--font-display); font-size: 15px; color: var(--lantern); white-space: nowrap; letter-spacing: 0.02em; }
.depth b { font-weight: 700; }
.bar { position: relative; flex: 1 1 120px; min-width: 110px; height: 20px; background: var(--hp-dim); border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 0 1px #0006; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#e85a4c, var(--hp)); transition: width .25s; }
.bar span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--font-display); text-shadow: 0 1px 0 #000; font-variant-numeric: tabular-nums; }
.xpbar { height: 3px; background: #1c2a33; border-radius: 2px; overflow: hidden; margin-top: 3px; }
.xpbar i { display: block; height: 100%; background: var(--xp); transition: width .25s; }
.hpwrap { flex: 1 1 140px; min-width: 120px; }
.stats { display: flex; gap: 10px; font: 14px var(--font-display); color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.stats .g b { color: var(--gold); }
.hud-btns { display: flex; gap: 6px; margin-left: auto; }
.icon-btn {
  min-width: 36px; height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; font: 14px var(--font-display); color: var(--dim);
}
.icon-btn:hover { color: var(--ink); border-color: #4a3d55; }
.icon-btn[aria-pressed="false"] { opacity: .55; }

/* ---------- Поле ---------- */
.stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
#view { position: absolute; inset: 0; display: block; touch-action: none; image-rendering: pixelated; }
#mini {
  position: absolute; top: 8px; right: 8px; width: 144px; height: 96px; image-rendering: pixelated;
  background: #0008; border: 1px solid #ffffff1a; border-radius: 4px; cursor: pointer;
}
.chips { position: absolute; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 55%; pointer-events: none; }
.chip { font: 12px var(--font-display); padding: 2px 7px; border-radius: 10px; background: #000a; border: 1px solid currentColor; }
.banner {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 32px);
  font: 14px var(--font-display); background: #000c; border: 1px solid var(--lantern); color: var(--lantern);
  padding: 6px 12px; border-radius: 6px; text-align: center;
}
.banner button { margin-left: 8px; background: var(--lantern); color: #1a1008; border: 0; border-radius: 4px; padding: 3px 10px; cursor: pointer; font: 600 13px var(--font-display); }
.banner button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line); }

/* ---------- Журнал ---------- */
.log {
  background: var(--panel); border-top: 1px solid var(--line); padding: 6px 16px; height: 5.6em; overflow: hidden;
  display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px; line-height: 1.35;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.1em); mask-image: linear-gradient(to bottom, transparent 0, #000 1.1em);
}
.log p { margin: 0; color: var(--dim); }
.log p.new { color: var(--ink); }
.log .hit { color: #f0e0c8; } .log .bad { color: var(--bad); } .log .good { color: var(--good); }
.log .loot { color: var(--gold); } .log .story { color: #e3c08f; font-style: italic; } .log .depth { color: var(--lantern); font-family: var(--font-display); }
.log .boss { color: #ff9ab0; font-weight: 700; } .log .ident { color: var(--magic); } .log .shop { color: #9fe2ff; }
.log .hint { color: #7f8fa0; } .log .kill { color: #d8d0c0; } .log .miss { color: #8a8290; }
.log p.old { opacity: .55; }

/* ---------- Кнопки ---------- */
.controls { display: flex; gap: 10px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line); align-items: center; }
.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 40px); gap: 4px; }
.dpad button, .acts button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  font: 15px var(--font-display); color: var(--ink); touch-action: manipulation;
}
.dpad button:active, .acts button:active { background: #3a2f45; transform: translateY(1px); }
.dpad button { font: 18px var(--font-body); }
.dpad .c { font: 12px var(--font-body); color: var(--dim); }
.acts { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.acts button { min-height: 40px; padding: 4px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.acts button small { font: 11px var(--font-body); color: var(--dim); }
.acts button.hot { border-color: var(--lantern); color: var(--lantern); }
.acts button:disabled { opacity: .35; }
@media (pointer: fine) { .dpad { display: none; } .acts { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (pointer: coarse) { .acts button small { display: none; } .acts button { font-size: 14px; } }
@media (max-width: 420px) {
  .hud { gap: 6px 10px; padding: 6px 12px; }
  .stats { gap: 8px; font-size: 13px; }
  .controls { gap: 8px; padding-left: 12px; padding-right: 12px; }
  .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 38px); }
  #mini { width: 96px; height: 64px; }
  .log { padding: 6px 12px; font-size: 13px; }
}

/* ---------- Окна ---------- */
.overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%);
  max-height: calc(100% - 16px); display: flex; flex-direction: column; box-shadow: 0 20px 60px #000c;
}
.sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet h2 { margin: 0; font: 600 20px var(--font-display); color: var(--lantern); flex: 1; text-wrap: balance; }
.sheet .body { overflow-y: auto; padding: 8px 16px 16px; min-height: 0; }
.close { background: none; border: 1px solid var(--line); border-radius: 6px; width: 34px; height: 32px; cursor: pointer; color: var(--dim); font: 16px var(--font-display); }
.equip-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 10px; }
.equip-row div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.equip-row small { display: block; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.equip-row b { font-weight: 400; font-family: var(--font-display); }
.inv { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.inv button {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--panel-2);
  border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
.inv button:hover, .inv button.sel { border-color: var(--lantern); }
.inv img { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.inv .nm { flex: 1; min-width: 0; }
.inv .tag { font: 12px var(--font-display); color: var(--lantern); }
.inv .key { font: 12px var(--font-display); color: var(--dim); width: 1.2em; }
.empty { color: var(--dim); padding: 12px 0; }
.detail { margin-top: 12px; padding: 12px; background: var(--panel-2); border-radius: 8px; border: 1px solid var(--line); }
.detail h3 { margin: 0 0 4px; font: 600 17px var(--font-display); }
.detail p { margin: 0 0 10px; color: var(--dim); }
.detail .row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  background: var(--lantern); color: #1a1008; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer;
  font: 600 15px var(--font-display);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--lantern); }

/* ---------- Титульный экран ---------- */
.title { position: fixed; inset: 0; z-index: 20; background: radial-gradient(ellipse at 50% 30%, #2a1c22e6 0%, #0d0b10f2 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; overflow-y: auto; text-align: center; }
.title canvas { width: 160px; height: 160px; image-rendering: pixelated; }
.title h1 { font: 700 clamp(40px, 11vw, 76px)/1 var(--font-display); margin: 8px 0 6px; color: var(--lantern); letter-spacing: .01em; text-shadow: 0 4px 0 #6b3a1a, 0 0 40px #ffb34740; text-wrap: balance; }
.title .sub { max-width: 34em; color: var(--dim); margin: 0 0 22px; }
.heroes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(560px, 100%); margin: 0 0 16px; }
.heroes button {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; min-width: 0;
  background: #17131ccc; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; text-align: center;
}
.heroes button[aria-checked="true"] { border-color: var(--lantern); background: #2a1f1acc; box-shadow: 0 0 0 1px var(--lantern) inset; }
.heroes img { image-rendering: pixelated; width: 40px; height: 40px; }
.heroes b { font: 16px var(--font-display); color: var(--ink); }
.heroes button[aria-checked="true"] b { color: var(--lantern); }
.heroes small { font-size: 12px; line-height: 1.3; color: var(--dim); }
.hero-about { display: none; margin: -6px 0 14px; color: var(--dim); font-size: 13px; max-width: 30em; }
@media (max-width: 420px) { .heroes small { display: none; } .hero-about { display: block; } .title .sub { margin-bottom: 14px; } }
.title .menu { display: flex; flex-direction: column; gap: 8px; width: min(300px, 100%); }
.title .menu .btn { padding: 12px; font-size: 17px; }
.title .seed { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 14px; color: var(--dim); font-size: 13px; flex-wrap: wrap; }
.title input { width: 110px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 6px 8px; font: 14px var(--font-display); }
.records { margin-top: 22px; width: min(420px, 100%); text-align: left; }
.records h3 { font: 600 14px var(--font-display); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
.records ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.records li { display: flex; gap: 10px; font-size: 13px; color: var(--dim); background: #ffffff08; padding: 4px 8px; border-radius: 4px; }
.records li b { color: var(--gold); font: 600 14px var(--font-display); min-width: 3.5em; font-variant-numeric: tabular-nums; }
.records li span { flex: 1; min-width: 0; }
.help dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 8px 0; }
.help dt { font: 14px var(--font-display); color: var(--lantern); white-space: nowrap; }
.help dd { margin: 0; color: var(--ink); }
.help p { color: var(--dim); }
.end-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
.end-stats div { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; }
.end-stats small { display: block; color: var(--dim); font-size: 12px; }
.end-stats b { font: 600 20px var(--font-display); font-variant-numeric: tabular-nums; }
.log { cursor: pointer; }
.log-full { font-size: 14px; color: var(--dim); }
.log-full .bad { color: var(--bad); } .log-full .good { color: var(--good); } .log-full .loot { color: var(--gold); }
.log-full .story { color: #e3c08f; font-style: italic; } .log-full .depth { color: var(--lantern); font-family: var(--font-display); margin-top: 8px !important; }
.log-full .boss { color: #ff9ab0; font-weight: 700; } .log-full .ident { color: var(--magic); } .log-full .shop { color: #9fe2ff; } .log-full .hit, .log-full .kill { color: var(--ink); }
.chron { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 4px; }
.chron li { display: flex; gap: 10px; font-size: 14px; }
.chron li span { font: 13px var(--font-display); color: var(--lantern); min-width: 3.4em; font-variant-numeric: tabular-nums; }
.toast {
  position: absolute; top: 44px; left: 50%; transform: translateX(-50%); z-index: 5; max-width: calc(100% - 32px);
  background: #1d1622f0; border: 1px solid var(--gold); border-radius: 8px; padding: 8px 14px;
  display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 8px 30px #000a;
  animation: toast-in .35s ease-out; transition: opacity .5s, transform .5s; pointer-events: none;
}
.toast b { font: 15px var(--font-display); color: var(--gold); }
.toast span { font-size: 13px; color: var(--dim); }
.toast.out { opacity: 0; transform: translate(-50%, -10px); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, -14px); } }
.ach { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.ach li { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); opacity: .5; border: 1px solid transparent; }
.ach li.got { opacity: 1; border-color: #ffd34e55; }
.ach li b { font: 15px var(--font-display); }
.ach li.got b { color: var(--gold); }
.ach li span { font-size: 13px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
@media (prefers-reduced-motion: reduce) { .bar i, .xpbar i { transition: none; } }
</style>

<div id="app">
  <header class="hud">
    <div class="depth" id="depth">Подвал · <b>1</b></div>
    <div class="hpwrap">
      <div class="bar" id="hpbar"><i id="hpfill"></i><span id="hptext">24 / 24</span></div>
      <div class="xpbar" title="Опыт до следующего уровня"><i id="xpfill"></i></div>
    </div>
    <div class="stats">
      <span title="Уровень героя">ур <b id="lvl">1</b></span>
      <span title="Урон оружия">урон <b id="dmg">2–4</b></span>
      <span title="Броня">броня <b id="arm">1</b></span>
      <span class="g" title="Монеты">монеты <b id="gold">0</b></span>
    </div>
    <div class="hud-btns">
      <button class="icon-btn" id="btn-sound" aria-pressed="true" title="Звук">♪</button>
      <button class="icon-btn" id="btn-help" title="Как играть (?)">?</button>
      <button class="icon-btn" id="btn-menu" title="Меню">≡</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="view" aria-label="Игровое поле"></canvas>
    <canvas id="mini" aria-label="Мини-карта" title="Мини-карта (M)"></canvas>
    <div class="chips" id="chips"></div>
    <div class="banner" id="banner" hidden></div>
  </main>
  <section class="log" id="log" aria-live="polite"></section>
  <nav class="controls" id="controls">
    <div class="dpad" id="dpad">
      <button data-d="-1,-1" aria-label="Вверх-влево">↖</button><button data-d="0,-1" aria-label="Вверх">↑</button><button data-d="1,-1" aria-label="Вверх-вправо">↗</button>
      <button data-d="-1,0" aria-label="Влево">←</button><button data-d="0,0" class="c" aria-label="Ждать">•</button><button data-d="1,0" aria-label="Вправо">→</button>
      <button data-d="-1,1" aria-label="Вниз-влево">↙</button><button data-d="0,1" aria-label="Вниз">↓</button><button data-d="1,1" aria-label="Вниз-вправо">↘</button>
    </div>
    <div class="acts">
      <button id="act-explore">Разведка<small>X</small></button>
      <button id="act-pick">Взять<small>G</small></button>
      <button id="act-down">Вниз<small>&gt;</small></button>
      <button id="act-inv">Рюкзак<small>I</small></button>
      <button id="act-fire">Бросить<small>F</small></button>
      <button id="act-wait">Ждать<small>Пробел</small></button>
    </div>
  </nav>
</div>

<div class="overlay" id="modal" hidden></div>
<div class="title" id="title" hidden></div>

<script>
/*SCRIPT*/
</script>
