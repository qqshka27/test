const _spriteCache = new Map();

// Готовый холст со спрайтом; tint заменяет пиксели 'x'
function getSprite(name, tint, overrideColor) {
  const key = name + '|' + (tint || '') + '|' + (overrideColor || '');
  let c = _spriteCache.get(key);
  if (c) return c;
  const rows = SPRITES[name] || SPRITES.potion;
  const h = rows.length, w = rows[0].length;
  c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      let col = ch === 'x' ? (tint || '#c0c0c0') : PALETTE[ch];
      if (overrideColor) col = overrideColor;
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x, y, 1, 1);
    }
  }
  _spriteCache.set(key, c);
  return c;
}

// ===== Отрисовка на canvas =====

const R = {
  canvas: null, ctx: null, dpr: 1, ts: 32, w: 0, h: 0,
  cam: { x: 0, y: 0, init: false },
  anim: new Map(), // id -> {x, y, bx, by, flash}
  floats: [], particles: [], bolts: [], projectiles: [], deaths: [], rings: [],
  shake: 0, fadeIn: 0, bossPulse: 0,
  mapCanvas: null, mapKey: '', mini: null,
  hover: null, target: null, targetPath: null,
  time: 0,
};

function initRenderer(canvas, mini) {
  R.canvas = canvas;
  R.ctx = canvas.getContext('2d');
  R.mini = mini;
  R.mapCanvas = document.createElement('canvas');
  R.mapCanvas.width = MAP_W * 8;
  R.mapCanvas.height = MAP_H * 8;
  resizeRenderer();
}

function resizeRenderer() {
  const c = R.canvas;
  const rect = c.parentElement.getBoundingClientRect();
  R.dpr = Math.min(window.devicePixelRatio || 1, 3);
  R.w = Math.max(100, rect.width);
  R.h = Math.max(100, rect.height);
  c.width = Math.round(R.w * R.dpr);
  c.height = Math.round(R.h * R.dpr);
  c.style.width = R.w + 'px';
  c.style.height = R.h + 'px';
  // На телефоне видно ~13 клеток в ширину, на компьютере больше
  const want = R.w < 520 ? 12.5 : R.w < 900 ? 17 : 23;
  R.ts = clamp(Math.floor(R.w / want / 2) * 2, 24, 56);
  if (R.h / R.ts < 9) R.ts = Math.max(20, Math.floor(R.h / 9 / 2) * 2);
}

// Детерминированный шум по координатам — чтобы стены не «мигали»
function hash2(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r * f), 0, 255); g = clamp(Math.round(g * f), 0, 255); b = clamp(Math.round(b * f), 0, 255);
  return `rgb(${r},${g},${b})`;
}

// Перерисовываем пиксельную карту уровня только при изменении тайлов
function rebuildMap(g) {
  const lv = g.level;
  let key = g.depth + ':' + g.seed + ':';
  // Быстрый хэш тайлов
  let h = 0;
  for (let i = 0; i < lv.tiles.length; i++) h = (Math.imul(h, 31) + lv.tiles[i] + 1) | 0;
  key += h;
  if (key === R.mapKey) return;
  R.mapKey = key;
  const ctx = R.mapCanvas.getContext('2d');
  const th = THEMES[lv.theme];
  ctx.fillStyle = th.fog;
  ctx.fillRect(0, 0, R.mapCanvas.width, R.mapCanvas.height);
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) drawTilePixels(ctx, lv, th, x, y);
  }
}

function px(ctx, color, x, y, w = 1, h = 1) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

function drawFloorPixels(ctx, th, X, Y, x, y) {
  px(ctx, th.floor, X, Y, 8, 8);
  const r = hash2(x, y);
  if (r < 0.5) px(ctx, th.floorDot, X + Math.floor(hash2(x, y, 1) * 7), Y + Math.floor(hash2(x, y, 2) * 7), 1, 1);
  if (r < 0.2) px(ctx, th.floorDot, X + Math.floor(hash2(x, y, 3) * 6), Y + Math.floor(hash2(x, y, 4) * 6), 2, 1);
  // тонкие швы плитки
  px(ctx, shade(th.floor, 0.85), X, Y + 7, 8, 1);
  px(ctx, shade(th.floor, 0.85), X + 7, Y, 1, 8);
}

function drawTilePixels(ctx, lv, th, x, y) {
  const X = x * 8, Y = y * 8;
  const t = lv.tiles[idx(x, y)];
  const below = y + 1 < MAP_H ? lv.tiles[idx(x, y + 1)] : T.WALL;
  switch (t) {
    case T.WALL: {
      if (below !== T.WALL) {
        // Лицевая сторона стены: кирпичи
        px(ctx, th.wall, X, Y, 8, 8);
        px(ctx, th.wallHi, X, Y, 8, 1);
        const off = (y % 2) * 4;
        px(ctx, th.wallLo, X, Y + 3, 8, 1);
        px(ctx, th.wallLo, X, Y + 7, 8, 1);
        px(ctx, th.wallLo, X + ((1 + off) % 8), Y + 1, 1, 2);
        px(ctx, th.wallLo, X + ((5 + off) % 8), Y + 4, 1, 3);
        if (hash2(x, y, 7) < 0.25) px(ctx, th.wallHi, X + 2 + Math.floor(hash2(x, y, 8) * 4), Y + 5, 2, 1);
      } else {
        // Верх стены
        px(ctx, th.wallLo, X, Y, 8, 8);
        if (hash2(x, y, 5) < 0.3) px(ctx, shade(th.wallLo, 1.15), X + Math.floor(hash2(x, y, 6) * 6), Y + Math.floor(hash2(x, y, 9) * 6), 2, 2);
      }
      break;
    }
    case T.FLOOR: drawFloorPixels(ctx, th, X, Y, x, y); break;
    case T.DOOR:
      drawFloorPixels(ctx, th, X, Y, x, y);
      px(ctx, '#3a2418', X, Y, 8, 8);
      px(ctx, '#7a4a2a', X + 1, Y + 1, 6, 7);
      px(ctx, '#5a341c', X + 3, Y + 1, 1, 7);
      px(ctx, '#5a341c', X + 1, Y + 3, 6, 1);
      px(ctx, '#ffd34e', X + 5, Y + 5, 1, 1);
      break;
    case T.ODOOR:
      drawFloorPixels(ctx, th, X, Y, x, y);
      px(ctx, '#3a2418', X, Y, 1, 8);
      px(ctx, '#3a2418', X + 7, Y, 1, 8);
      px(ctx, '#7a4a2a', X + 1, Y, 1, 8);
      break;
    case T.STAIRS:
      drawFloorPixels(ctx, th, X, Y, x, y);
      for (let i = 0; i < 4; i++) {
        px(ctx, shade(th.floor, 0.25 + i * 0.12), X + 1, Y + 1 + i * 2, 6, 2);
        px(ctx, shade(th.wallHi, 0.9 - i * 0.15), X + 1, Y + 1 + i * 2, 6, 1);
      }
      break;
    case T.UPSTAIRS:
      drawFloorPixels(ctx, th, X, Y, x, y);
      for (let i = 0; i < 4; i++) px(ctx, shade(th.wallHi, 0.6 + i * 0.15), X + 1, Y + 6 - i * 2, 6, 1);
      px(ctx, '#e6d9a8', X + 3, Y, 2, 1);
      break;
    case T.WATER:
      px(ctx, th.water, X, Y, 8, 8);
      px(ctx, shade(th.water, 1.3), X + (hash2(x, y) * 4 | 0), Y + 2, 3, 1);
      px(ctx, shade(th.water, 1.2), X + 3 + (hash2(x, y, 2) * 4 | 0), Y + 5, 3, 1);
      break;
    case T.GRASS:
      drawFloorPixels(ctx, th, X, Y, x, y);
      for (let i = 0; i < 5; i++) {
        const gx = X + Math.floor(hash2(x, y, 10 + i) * 7), gy = Y + 2 + Math.floor(hash2(x, y, 20 + i) * 4);
        px(ctx, th.grass, gx, gy, 1, 3);
        px(ctx, shade(th.grass, 1.35), gx, gy, 1, 1);
      }
      break;
    case T.BARS:
      drawFloorPixels(ctx, th, X, Y, x, y);
      for (let i = 0; i < 4; i++) px(ctx, '#8a8f9e', X + 1 + i * 2, Y, 1, 8);
      px(ctx, '#5a5f6e', X, Y + 1, 8, 1);
      px(ctx, '#5a5f6e', X, Y + 6, 8, 1);
      break;
    default:
      px(ctx, th.fog, X, Y, 8, 8);
  }
}

// ---------- События игры → анимации ----------

function consumeFx(g) {
  const p = g.player;
  for (const e of g.fx) {
    switch (e.type) {
      case 'float': R.floats.push({ x: e.x, y: e.y, text: e.text, color: e.color, t: 0, big: e.big, dx: (Math.random() - 0.5) * 0.3 }); break;
      case 'bump': {
        const a = R.anim.get(e.id);
        if (a) { const dx = sign(e.tx - e.x), dy = sign(e.ty - e.y); a.bx = dx * 0.35; a.by = dy * 0.35; }
        break;
      }
      case 'shot': R.projectiles.push({ pts: lineBetween(e.x, e.y, e.tx, e.ty).slice(1), t: 0, color: e.color || '#fff', arrow: true }); break;
      case 'flash': { const a = R.anim.get(e.id); if (a) a.flash = 1; break; }
      case 'shake': R.shake = Math.max(R.shake, e.power); break;
      case 'particles': burst(e.x, e.y, e.color, e.n); break;
      case 'death': R.deaths.push({ x: e.x, y: e.y, sprite: e.sprite, t: 0, big: e.big }); burst(e.x, e.y, '#d8d0c0', 10); break;
      case 'bolt': R.bolts.push({ pts: e.pts, color: e.color, t: 0, thin: e.thin }); break;
      case 'projectile': R.projectiles.push({ pts: e.pts, t: 0, sprite: e.sprite, tint: e.tint }); break;
      case 'explosion': R.rings.push({ x: e.x, y: e.y, r: e.r, t: 0, color: '#ff9a3c', fill: true }); burst(e.x, e.y, '#ffb347', 30, 2.5); break;
      case 'bark': R.rings.push({ x: e.x, y: e.y, r: 5, t: 0, color: '#ffe0a0' }); break;
      case 'levelup': R.rings.push({ x: e.x, y: e.y, r: 1.5, t: 0, color: '#ffd34e' }); burst(e.x, e.y, '#ffd34e', 20, 1.2, -1); break;
      case 'teleport': { const a = R.anim.get(e.id); if (a) { a.x = p.x; a.y = p.y; } break; }
      case 'levelin': R.fadeIn = 1; R.anim.clear(); R.cam.init = false; R.floats = []; R.particles = []; R.deaths = []; break;
      case 'boss': R.bossPulse = 1; break;
      case 'sound': playSound(e.name); break;
    }
  }
  g.fx.length = 0;
}

function burst(x, y, color, n, speed = 1.5, up = 0) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.3 + Math.random()) * speed;
    R.particles.push({ x: x + 0.5, y: y + 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s + up, life: 1, color, size: Math.random() < 0.3 ? 2 : 1 });
  }
}

// ---------- Кадр ----------

function renderFrame(g, dt) {
  const ctx = R.ctx;
  R.time += dt;
  rebuildMap(g);
  const lv = g.level, p = g.player, th = THEMES[lv.theme];
  const ts = R.ts;

  // Анимационные позиции актёров
  const all = [p, ...g.actors];
  const k = 1 - Math.pow(0.0001, dt); // плавное догоняние
  for (const a of all) {
    let an = R.anim.get(a.id);
    if (!an) { an = { x: a.x, y: a.y, bx: 0, by: 0, flash: 0 }; R.anim.set(a.id, an); }
    if (Math.abs(an.x - a.x) > 3 || Math.abs(an.y - a.y) > 3) { an.x = a.x; an.y = a.y; }
    an.x += (a.x - an.x) * Math.min(1, k * 1.6);
    an.y += (a.y - an.y) * Math.min(1, k * 1.6);
    an.bx *= Math.pow(0.002, dt); an.by *= Math.pow(0.002, dt);
    an.flash = Math.max(0, an.flash - dt * 6);
  }
  for (const id of R.anim.keys()) if (id !== 0 && !g.actors.some((a) => a.id === id)) R.anim.delete(id);

  // Камера
  const pa = R.anim.get(0);
  const viewW = R.w / ts, viewH = R.h / ts;
  let cx = pa.x + 0.5 - viewW / 2, cy = pa.y + 0.5 - viewH / 2;
  // Не показываем пустоту за краями карты, если карта больше экрана
  if (MAP_W > viewW) cx = clamp(cx, -0.5, MAP_W - viewW + 0.5); else cx = (MAP_W - viewW) / 2;
  if (MAP_H > viewH) cy = clamp(cy, -0.5, MAP_H - viewH + 0.5); else cy = (MAP_H - viewH) / 2;
  if (!R.cam.init) { R.cam.x = cx; R.cam.y = cy; R.cam.init = true; }
  R.cam.x += (cx - R.cam.x) * Math.min(1, k * 1.2);
  R.cam.y += (cy - R.cam.y) * Math.min(1, k * 1.2);
  let sx = 0, sy = 0;
  if (R.shake > 0) {
    sx = (Math.random() - 0.5) * R.shake * 2; sy = (Math.random() - 0.5) * R.shake * 2;
    R.shake = Math.max(0, R.shake - dt * 25);
  }

  ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = th.fog;
  ctx.fillRect(0, 0, R.w, R.h);
  const ox = Math.round(-R.cam.x * ts + sx), oy = Math.round(-R.cam.y * ts + sy);
  const toX = (x) => ox + x * ts, toY = (y) => oy + y * ts;

  const x0 = Math.max(0, Math.floor(R.cam.x) - 1), y0 = Math.max(0, Math.floor(R.cam.y) - 1);
  const x1 = Math.min(MAP_W - 1, Math.ceil(R.cam.x + viewW) + 1), y1 = Math.min(MAP_H - 1, Math.ceil(R.cam.y + viewH) + 1);

  // Тайлы: рисуем одну большую картинку, затем затемняем
  ctx.drawImage(R.mapCanvas, 0, 0, MAP_W * 8, MAP_H * 8, ox, oy, MAP_W * ts, MAP_H * ts);

  // Анимация воды
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (lv.tiles[idx(x, y)] === T.WATER && lv.visible[idx(x, y)]) {
      const ph = R.time * 1.6 + x * 0.7 + y * 0.4;
      ctx.fillStyle = 'rgba(180,220,255,0.10)';
      const wy = (Math.sin(ph) * 0.5 + 0.5) * ts * 0.7;
      ctx.fillRect(toX(x) + ts * 0.15, toY(y) + wy, ts * 0.5, Math.max(1, ts / 8));
    }
  }

  // Ловушки
  for (const t of g.traps) {
    if (t.hidden || !lv.seen[idx(t.x, t.y)]) continue;
    drawSprite(ctx, 'trap', toX(t.x), toY(t.y), ts, 1);
  }
  // Предметы
  for (const it of g.items) {
    if (!lv.seen[idx(it.x, it.y)] && !lv.detect) continue;
    const bob = lv.visible[idx(it.x, it.y)] ? Math.sin(R.time * 3 + it.id) * ts * 0.03 : 0;
    drawSprite(ctx, itemSprite(g, it), toX(it.x) + ts * 0.1, toY(it.y) + ts * 0.1 + bob, ts * 0.8, 1, itemTint(g, it));
    if (it.price && lv.visible[idx(it.x, it.y)]) {
      ctx.font = `${Math.max(9, ts * 0.3)}px "Tiny5", monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000a';
      ctx.fillText(it.price, toX(it.x) + ts / 2 + 1, toY(it.y) + ts + 1);
      ctx.fillStyle = '#ffd34e';
      ctx.fillText(it.price, toX(it.x) + ts / 2, toY(it.y) + ts);
    }
  }

  // Затемнение: память и расстояние
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const i = idx(x, y);
      if (!lv.seen[i]) { ctx.fillStyle = th.fog; ctx.fillRect(toX(x), toY(y), ts, ts); continue; }
      if (!lv.visible[i]) { ctx.fillStyle = 'rgba(8,8,18,0.58)'; ctx.fillRect(toX(x), toY(y), ts, ts); continue; }
      const d = Math.hypot(x - p.x, y - p.y) / (FOV_RADIUS + 0.5);
      const a = clamp(d * d * 0.5, 0, 0.5);
      if (a > 0.02) { ctx.fillStyle = `rgba(6,4,10,${a.toFixed(3)})`; ctx.fillRect(toX(x), toY(y), ts, ts); }
    }
  }

  // Тёплый свет фонаря вокруг героя
  {
    const P = R.anim.get(0);
    const lx = toX(P.x) + ts / 2, ly = toY(P.y) + ts / 2;
    const flick = 1 + Math.sin(R.time * 7.3) * 0.015 + Math.sin(R.time * 13.1) * 0.01;
    const lg = ctx.createRadialGradient(lx, ly, ts * 0.3, lx, ly, ts * FOV_RADIUS * 0.75 * flick);
    lg.addColorStop(0, 'rgba(255,170,80,0.16)');
    lg.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = lg;
    ctx.fillRect(lx - ts * FOV_RADIUS, ly - ts * FOV_RADIUS, ts * FOV_RADIUS * 2, ts * FOV_RADIUS * 2);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Трупики (исчезают)
  for (const d of R.deaths) {
    d.t += dt;
    const a = Math.max(0, 1 - d.t * 2.2);
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    const s = d.big ? ts * 1.6 : ts;
    drawSprite(ctx, d.sprite, toX(d.x) + (ts - s) / 2, toY(d.y) + (ts - s) / 2 - d.t * ts * 0.5, s, 1, null, '#ffffff');
    ctx.globalAlpha = 1;
  }
  R.deaths = R.deaths.filter((d) => d.t < 0.5);

  // Монстры
  const sorted = g.actors.slice().sort((a, b) => a.y - b.y);
  for (const m of sorted) {
    const def = MONSTERS[m.type];
    const vis = monsterVisible(g, m);
    if (!vis) continue;
    const an = R.anim.get(m.id);
    const dx = toX(an.x + an.bx), dy = toY(an.y + an.by);
    const inSight = canSee(g, m.x, m.y);
    if (!inSight) ctx.globalAlpha = 0.45;
    // тень
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(dx + ts / 2, dy + ts * 0.9, ts * (def.boss ? 0.7 : 0.32), ts * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    let sprite = def.sprite;
    if (m.disguised) sprite = 'chest';
    const breathe = !m.disguised && m.awake ? Math.sin(R.time * 4 + m.id) * ts * 0.03 : 0;
    if (def.boss) {
      const s = ts * 1.7;
      drawSprite(ctx, sprite, dx + (ts - s) / 2, dy + ts - s + breathe, s, 1, null, an.flash > 0.5 ? '#ffffff' : null);
    } else {
      if (m.type === 'ghost' || m.type === 'shade') ctx.globalAlpha *= 0.55 + Math.sin(R.time * 2.5 + m.id) * 0.2;
      drawSprite(ctx, sprite, dx + ts * 0.06, dy + ts * 0.04 + breathe, ts * 0.88, 1, null, an.flash > 0.5 ? '#ffffff' : null);
    }
    ctx.globalAlpha = 1;
    // Полоска здоровья
    if (!def.peaceful && !m.disguised && m.hp < m.maxHp && inSight) {
      const w = def.boss ? ts * 1.6 : ts * 0.8, bx = dx + (ts - w) / 2, by = def.boss ? dy - ts * 0.8 : dy - ts * 0.08;
      ctx.fillStyle = '#000c'; ctx.fillRect(bx - 1, by - 1, w + 2, Math.max(3, ts / 10) + 2);
      ctx.fillStyle = m.hp / m.maxHp > 0.5 ? '#5fbf5a' : m.hp / m.maxHp > 0.25 ? '#e0a43a' : '#d8433c';
      ctx.fillRect(bx, by, w * Math.max(0, m.hp / m.maxHp), Math.max(3, ts / 10));
    }
    // Статусы
    if (inSight && (!m.awake || m.status.sleep) && !m.disguised && !def.peaceful) {
      const zz = (R.time * 0.6 + m.id * 0.37) % 1;
      ctx.font = `${Math.max(10, ts * (0.28 + zz * 0.14))}px "Tiny5", monospace`;
      ctx.textAlign = 'center';
      ctx.globalAlpha = 1 - zz;
      ctx.fillStyle = '#c9d6ff';
      ctx.fillText('z', dx + ts * (0.75 + zz * 0.15), dy + ts * (0.1 - zz * 0.35));
      ctx.globalAlpha = 1;
    }
    if (inSight && (m.status.confused || m.status.fear || m.status.distracted)) {
      ctx.font = `${Math.max(10, ts * 0.38)}px "Tiny5", monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = m.status.fear ? '#c9b3ff' : m.status.distracted ? '#ffb070' : '#7fe0b0';
      ctx.fillText(m.status.fear ? '!' : m.status.distracted ? '♥' : '?', dx + ts * 0.85, dy + ts * 0.1);
    }
  }

  // Игрок
  {
    const an = R.anim.get(0);
    const dx = toX(an.x + an.bx), dy = toY(an.y + an.by);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(dx + ts / 2, dy + ts * 0.9, ts * 0.3, ts * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    if (g.over && !g.over.won) ctx.globalAlpha = 0.4;
    drawSprite(ctx, 'player', dx + ts * 0.06, dy + ts * 0.04, ts * 0.88, 1, null, an.flash > 0.5 ? '#ff6b5e' : null);
    ctx.globalAlpha = 1;
    if (p.status.haste) { ctx.fillStyle = 'rgba(159,226,255,0.5)'; ctx.fillRect(dx - ts * 0.12, dy + ts * 0.4, ts * 0.12, 2); ctx.fillRect(dx - ts * 0.2, dy + ts * 0.6, ts * 0.16, 2); }
  }

  // Молнии и лучи
  for (const b of R.bolts) {
    b.t += dt;
    const a = Math.max(0, 1 - b.t * 3);
    if (!b.pts.length) continue;
    ctx.strokeStyle = b.color;
    ctx.globalAlpha = a;
    ctx.lineWidth = b.thin ? Math.max(2, ts / 10) : Math.max(3, ts / 6);
    ctx.beginPath();
    const P = R.anim.get(0);
    ctx.moveTo(toX(P.x) + ts / 2, toY(P.y) + ts / 2);
    for (const [x, y] of b.pts) {
      const j = b.thin ? 0 : (Math.random() - 0.5) * ts * 0.4;
      ctx.lineTo(toX(x) + ts / 2 + j, toY(y) + ts / 2 + j);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  R.bolts = R.bolts.filter((b) => b.t < 0.34);

  // Снаряды
  for (const pr of R.projectiles) {
    pr.t += dt;
    const n = pr.pts.length;
    if (!n) continue;
    const pos = Math.min(n - 1, pr.t * 28);
    const i = Math.floor(pos), f = pos - i;
    const [ax, ay] = pr.pts[i], [bx2, by2] = pr.pts[Math.min(n - 1, i + 1)];
    const x = ax + (bx2 - ax) * f, y = ay + (by2 - ay) * f;
    if (pr.sprite) drawSprite(ctx, pr.sprite, toX(x) + ts * 0.25, toY(y) + ts * 0.25, ts * 0.5, 1, pr.tint);
    else { ctx.fillStyle = pr.color; ctx.fillRect(toX(x) + ts * 0.35, toY(y) + ts * 0.45, ts * 0.3, Math.max(2, ts / 12)); }
  }
  R.projectiles = R.projectiles.filter((pr) => pr.t * 28 < pr.pts.length + 1);

  // Кольца (взрывы, лай)
  for (const r of R.rings) {
    r.t += dt;
    const k2 = Math.min(1, r.t * 2.5);
    ctx.globalAlpha = 1 - k2;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = Math.max(2, ts / 8);
    ctx.beginPath();
    ctx.arc(toX(r.x) + ts / 2, toY(r.y) + ts / 2, (r.r + 0.5) * ts * k2, 0, Math.PI * 2);
    if (r.fill) { ctx.fillStyle = r.color; ctx.globalAlpha = (1 - k2) * 0.35; ctx.fill(); ctx.globalAlpha = 1 - k2; }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  R.rings = R.rings.filter((r) => r.t < 0.4);

  // Частицы
  for (const q of R.particles) {
    q.x += q.vx * dt * 2; q.y += q.vy * dt * 2;
    q.vy += dt * 2.5; q.vx *= 0.96;
    q.life -= dt * 1.6;
    if (q.life <= 0) continue;
    ctx.globalAlpha = Math.min(1, q.life * 1.5);
    ctx.fillStyle = q.color;
    const s = Math.max(2, ts / 10) * q.size;
    ctx.fillRect(toX(q.x) - s / 2, toY(q.y) - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  R.particles = R.particles.filter((q) => q.life > 0);

  // Цифры урона
  ctx.textAlign = 'center';
  for (const f of R.floats) {
    f.t += dt;
    const a = Math.max(0, 1 - f.t * 1.1);
    const size = Math.max(11, ts * (f.big ? 0.62 : 0.45));
    ctx.font = `${size}px "Tiny5", monospace`;
    const fx2 = toX(f.x + 0.5 + f.dx * f.t), fy = toY(f.y) - f.t * ts * 0.9 + ts * 0.2;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#000';
    ctx.fillText(f.text, fx2 + 1, fy + 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, fx2, fy);
  }
  ctx.globalAlpha = 1;
  R.floats = R.floats.filter((f) => f.t < 0.95);

  // Прицел
  if (R.target) {
    if (R.targetPath) {
      ctx.fillStyle = 'rgba(255,211,78,0.35)';
      for (const [x, y] of R.targetPath) ctx.fillRect(toX(x) + ts * 0.4, toY(y) + ts * 0.4, ts * 0.2, ts * 0.2);
    }
    const pulse = 0.6 + Math.sin(R.time * 8) * 0.4;
    ctx.strokeStyle = `rgba(255,211,78,${pulse})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(toX(R.target.x) + 1, toY(R.target.y) + 1, ts - 2, ts - 2);
  } else if (R.hover && lv.seen[idx(R.hover.x, R.hover.y)]) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(toX(R.hover.x) + 0.5, toY(R.hover.y) + 0.5, ts - 1, ts - 1);
  }

  // Виньетка и эффекты экрана
  const grad = ctx.createRadialGradient(R.w / 2, R.h / 2, Math.min(R.w, R.h) * 0.35, R.w / 2, R.h / 2, Math.max(R.w, R.h) * 0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, R.w, R.h);
  if (p.hp < p.maxHp * 0.3 && !g.over) {
    const a = 0.12 + Math.sin(R.time * 5) * 0.08;
    ctx.fillStyle = `rgba(200,30,30,${a})`;
    ctx.fillRect(0, 0, R.w, R.h);
  }
  if (R.bossPulse > 0) {
    ctx.fillStyle = `rgba(160,20,40,${R.bossPulse * 0.4})`;
    ctx.fillRect(0, 0, R.w, R.h);
    R.bossPulse = Math.max(0, R.bossPulse - dt * 0.8);
  }
  if (R.fadeIn > 0) {
    ctx.fillStyle = `rgba(0,0,0,${R.fadeIn})`;
    ctx.fillRect(0, 0, R.w, R.h);
    R.fadeIn = Math.max(0, R.fadeIn - dt * 1.8);
  }
  renderMinimap(g);
}

function drawSprite(ctx, name, x, y, size, alpha = 1, tint, override) {
  const s = getSprite(name, tint, override);
  if (alpha !== 1) ctx.globalAlpha *= alpha;
  ctx.drawImage(s, Math.round(x), Math.round(y), Math.round(size), Math.round(size));
  if (alpha !== 1) ctx.globalAlpha /= alpha;
}

// Экранные координаты → клетка карты
function screenToTile(clientX, clientY) {
  const rect = R.canvas.getBoundingClientRect();
  const x = (clientX - rect.left) / R.ts + R.cam.x;
  const y = (clientY - rect.top) / R.ts + R.cam.y;
  return { x: Math.floor(x), y: Math.floor(y) };
}

let _miniFrame = 0;
function renderMinimap(g) {
  if (!R.mini || R.mini.hidden) return;
  if (++_miniFrame % 6) return;
  const c = R.mini, ctx = c.getContext('2d');
  const s = 3;
  if (c.width !== MAP_W * s) { c.width = MAP_W * s; c.height = MAP_H * s; }
  const lv = g.level, th = THEMES[lv.theme];
  ctx.clearRect(0, 0, c.width, c.height);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const i = idx(x, y);
    if (!lv.seen[i]) continue;
    const t = lv.tiles[i];
    let col = null;
    if (t === T.WALL) col = th.wall;
    else if (t === T.STAIRS) col = '#ffd34e';
    else if (t === T.WATER) col = th.water;
    else if (t === T.DOOR || t === T.ODOOR) col = '#a0703a';
    else if (t === T.BARS) col = '#8a8f9e';
    else col = lv.visible[i] ? '#6a6070' : '#3a3440';
    ctx.fillStyle = col;
    ctx.fillRect(x * s, y * s, s, s);
  }
  for (const it of g.items) if (lv.seen[idx(it.x, it.y)]) { ctx.fillStyle = it.kind === 'gold' ? '#ffd34e' : '#8fd3ff'; ctx.fillRect(it.x * s, it.y * s, s, s); }
  for (const m of g.actors) if (monsterVisible(g, m)) { ctx.fillStyle = MONSTERS[m.type].peaceful ? '#7fe0b0' : '#ff5a4a'; ctx.fillRect(m.x * s, m.y * s, s, s); }
  ctx.fillStyle = '#fff';
  ctx.fillRect(g.player.x * s - 1, g.player.y * s - 1, s + 2, s + 2);
}

// ---- 11_audio.js ----
// ===== Звук: маленький синтезатор на WebAudio =====

const AUDIO = { ctx: null, on: true, master: null, last: {} };

function audioInit() {
  if (AUDIO.ctx) { if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AUDIO.ctx = new AC();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = 0.22;
    AUDIO.master.connect(AUDIO.ctx.destination);
  } catch (e) { AUDIO.ctx = null; }
}

function tone(freq, dur, type = 'square', vol = 0.5, slide = 0, delay = 0) {
  const a = AUDIO.ctx;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(AUDIO.master);
  o.start(t); o.stop(t + dur + 0.02);
}

function noise(dur, vol = 0.4, freq = 1200, delay = 0) {
  const a = AUDIO.ctx;
  const t = a.currentTime + delay;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = freq;
  const gn = a.createGain();
  gn.gain.value = vol;
  src.connect(f); f.connect(gn); gn.connect(AUDIO.master);
  src.start(t);
}

function playSound(name) {
  if (!AUDIO.on || !AUDIO.ctx) return;
  // Не долбим один и тот же звук чаще 40 мс
  const now = performance.now();
  if (AUDIO.last[name] && now - AUDIO.last[name] < 40) return;
  AUDIO.last[name] = now;
  try {
    switch (name) {
      case 'hit': noise(0.08, 0.5, 900); tone(140, 0.08, 'square', 0.25, -60); break;
      case 'miss': tone(500, 0.06, 'triangle', 0.15, 200); break;
      case 'hurt': noise(0.12, 0.6, 600); tone(110, 0.15, 'sawtooth', 0.3, -50); break;
      case 'kill': tone(300, 0.08, 'square', 0.2, -200); noise(0.15, 0.3, 500, 0.04); break;
      case 'coin': tone(988, 0.06, 'square', 0.18); tone(1319, 0.12, 'square', 0.18, 0, 0.06); break;
      case 'pickup': tone(660, 0.05, 'triangle', 0.25); tone(880, 0.07, 'triangle', 0.25, 0, 0.05); break;
      case 'equip': noise(0.06, 0.3, 3000); tone(220, 0.06, 'square', 0.15); break;
      case 'door': noise(0.12, 0.3, 400); break;
      case 'descend': for (let i = 0; i < 4; i++) tone(440 - i * 70, 0.09, 'triangle', 0.25, 0, i * 0.08); break;
      case 'levelup': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.18, 0, i * 0.08)); break;
      case 'drink': tone(300, 0.15, 'sine', 0.3, 300); tone(500, 0.1, 'sine', 0.2, 200, 0.1); break;
      case 'eat': noise(0.05, 0.3, 2000); noise(0.05, 0.3, 2000, 0.1); break;
      case 'scroll': noise(0.18, 0.2, 5000); tone(880, 0.2, 'sine', 0.15, 440); break;
      case 'zap': tone(1200, 0.2, 'sawtooth', 0.15, -900); noise(0.15, 0.25, 6000); break;
      case 'throw': noise(0.1, 0.2, 2500); break;
      case 'glass': tone(2000, 0.05, 'triangle', 0.2); noise(0.15, 0.3, 7000, 0.02); break;
      case 'boom': noise(0.5, 0.8, 300); tone(80, 0.4, 'sawtooth', 0.4, -40); break;
      case 'trap': tone(200, 0.1, 'square', 0.3, 400); noise(0.1, 0.4, 1500); break;
      case 'chest': tone(392, 0.08, 'square', 0.2); tone(523, 0.08, 'square', 0.2, 0, 0.08); tone(784, 0.15, 'square', 0.2, 0, 0.16); break;
      case 'roar': tone(90, 0.4, 'sawtooth', 0.4, -30); noise(0.4, 0.4, 400); break;
      case 'summon': tone(200, 0.3, 'sine', 0.3, 400); tone(150, 0.3, 'sine', 0.2, 300, 0.05); break;
      case 'bark':
        for (let i = 0; i < 3; i++) { tone(180, 0.09, 'sawtooth', 0.45, -90, i * 0.14); noise(0.08, 0.4, 900, i * 0.14); }
        break;
      case 'meow': tone(700, 0.15, 'triangle', 0.3, 300); tone(1000, 0.35, 'triangle', 0.3, -500, 0.15); break;
      case 'victory': [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.2, 0, i * 0.13)); break;
      case 'death': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.3, 0, i * 0.2)); break;
      case 'click': tone(800, 0.03, 'square', 0.1); break;
    }
  } catch (e) { /* звук не обязателен */ }
}

// ---- 12_ui.js ----
// ===== Интерфейс: HUD, окна, управление =====

let G = null;
const UI = { auto: null, targeting: null, modal: null, endTimer: null, saveTurn: 0, longPress: null, lastLog: null };
const SAVE_KEY = 'well-save-v1';
const REC_KEY = 'well-records-v1';
const SET_KEY = 'well-settings-v1';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function store(key, val) { try { if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val); } catch (e) { /* хранилище недоступно */ } }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

// ---------- Запуск ----------

function boot(hot) {
  initRenderer($('view'), $('mini'));
  const settings = JSON.parse(load(SET_KEY) || '{}');
  AUDIO.on = settings.sound !== false;
  if (settings.mini === false) $('mini').hidden = true;
  syncSoundBtn();
  bindInput();
  let restored = null;
  if (hot && hot.save) { try { restored = deserializeGame(hot.save); } catch (e) { restored = null; } }
  if (restored) { G = restored; afterAction(true); }
  else {
    // Под титулом виден живой уровень: это демо, оно не сохраняется
    showTitle();
    G = newGame(Date.now() % 100000);
    G._demo = true;
    afterAction(true);
  }
  window.addEventListener('resize', () => { resizeRenderer(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ save: G && !G.over && !G._demo && $('title').hidden ? serializeGame(G) : null }));
  }
  let last = performance.now();
  const frame = (t) => {
    const dt = Math.min(0.1, Math.max(0, (t - last) / 1000));
    last = t;
    if (G) { consumeFx(G); renderFrame(G, dt); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function startNewGame(seed) {
  stopAuto();
  cancelTargeting();
  clearTimeout(UI.endTimer);
  G = newGame(seed);
  UI.lastLog = null;
  R.mapKey = '';
  hideTitle();
  closeModal();
  afterAction(true);
  saveNow();
}

function saveNow() {
  if (!G) return;
  if (G._demo) return; // фоновая игра под титулом не сохраняется
  if (G.over) { store(SAVE_KEY, null); return; }
  store(SAVE_KEY, serializeGame(G));
}

// ---------- Действия ----------

function act(fn) {
  if (!G || G.over || !$('modal').hidden || !$('title').hidden) return false;
  audioInit();
  const r = fn();
  afterAction();
  return r;
}

function afterAction(force) {
  if (!G) return;
  renderHUD();
  renderLog();
  if (G.turn - UI.saveTurn >= 15 || force) { UI.saveTurn = G.turn; if ($('title').hidden) saveNow(); }
  if (G.over && !UI.endTimer && !G._demo) {
    stopAuto();
    cancelTargeting();
    store(SAVE_KEY, null);
    addRecord();
    UI.endTimer = setTimeout(() => { UI.endTimer = null; showEnd(); }, G.over.won ? 1800 : 1400);
  }
}

function move(dx, dy) {
  stopAuto();
  if (UI.targeting) { moveTarget(dx, dy); return; }
  if (dx === 0 && dy === 0) { act(() => playerWait(G)); return; }
  act(() => playerMove(G, dx, dy));
}

function doPickup() { stopAuto(); act(() => playerPickup(G)); }
function doDescend() {
  stopAuto();
  const p = G.player;
  if (G.level.stairs && G.level.tiles[idx(p.x, p.y)] !== T.STAIRS && G.level.seen[idx(G.level.stairs.x, G.level.stairs.y)]) {
    startAuto('travel', G.level.stairs, true);
    return;
  }
  act(() => playerDescend(G));
  R.mapKey = '';
  saveNow();
}

// ---------- Автоходьба ----------

function startAuto(kind, target, descendAtEnd) {
  stopAuto();
  if (!G || G.over) return;
  audioInit();
  const seen = new Set(visibleEnemies(G).map((m) => m.id));
  if (kind === 'explore' && seen.size) { msg(G, 'Рядом враг — сначала разберитесь с ним.', 'hint'); renderLog(); return; }
  UI.auto = { kind, target, descendAtEnd, hp: G.player.hp, seen, msgLen: G.messages.length, steps: 0 };
  UI.auto.timer = setInterval(autoTick, 55);
  renderHUD();
}

function stopAuto(text) {
  if (!UI.auto) return;
  clearInterval(UI.auto.timer);
  UI.auto = null;
  if (text && G) { msg(G, text, 'hint'); renderLog(); }
  renderHUD();
}

function autoTick() {
  const a = UI.auto;
  if (!a || !G || G.over || !$('modal').hidden) return stopAuto();
  const enemies = visibleEnemies(G);
  if (enemies.some((m) => !a.seen.has(m.id))) {
    const m = enemies.find((e) => !a.seen.has(e.id));
    return stopAuto(`Впереди: ${MONSTERS[m.type].name}.`);
  }
  if (G.player.hp < a.hp) return stopAuto();
  if (++a.steps > 400) return stopAuto();
  const p = G.player;
  if (a.kind === 'explore') {
    const r = exploreStep(G);
    if (r === 'danger') { afterAction(); return stopAuto('Рядом враг.'); }
    if (r === 'done') {
      const st = G.level.stairs;
      if (st && G.level.seen[idx(st.x, st.y)] && !(p.x === st.x && p.y === st.y)) {
        stopAuto();
        msg(G, 'Здесь всё исследовано. Идём к лестнице.', 'hint');
        startAuto('travel', st);
        return;
      }
      afterAction();
      return stopAuto(st && p.x === st.x && p.y === st.y ? 'Всё исследовано. Вы у лестницы.' : 'Больше исследовать нечего.');
    }
    if (r === 'stuck') { afterAction(); return stopAuto('Дальше не пройти.'); }
  } else {
    const step = travelStep(G, a.target.x, a.target.y);
    if (!step) {
      const there = p.x === a.target.x && p.y === a.target.y;
      const desc = a.descendAtEnd && there;
      stopAuto(there ? null : 'Туда не пройти.');
      if (desc) doDescend();
      return;
    }
    playerMove(G, step[0], step[1]);
  }
  afterAction();
  const fresh = G.messages.slice(a.msgLen);
  a.msgLen = G.messages.length;
  if (fresh.some((m) => ['bad', 'boss', 'shop', 'story'].includes(m.cls))) stopAuto();
}

// ---------- Прицеливание ----------

function startTargeting(item, mode) {
  stopAuto();
  closeModal();
  const t = nearestEnemy(G);
  UI.targeting = { item, mode };
  const p = G.player;
  R.target = t ? { x: t.x, y: t.y } : { x: p.x + 1, y: p.y };
  updateTargetPath();
  renderBanner();
}

function cancelTargeting() {
  UI.targeting = null;
  R.target = null;
  R.targetPath = null;
  renderBanner();
}

function moveTarget(dx, dy) {
  R.target = { x: clamp(R.target.x + dx, 0, MAP_W - 1), y: clamp(R.target.y + dy, 0, MAP_H - 1) };
  updateTargetPath();
  renderBanner();
}

function cycleTarget() {
  const list = G.actors.filter((a) => !MONSTERS[a.type].peaceful && monsterVisible(G, a) && canSee(G, a.x, a.y))
    .sort((a, b) => dist(a, G.player) - dist(b, G.player));
  if (!list.length) return;
  const cur = list.findIndex((a) => a.x === R.target.x && a.y === R.target.y);
  const n = list[(cur + 1) % list.length];
  R.target = { x: n.x, y: n.y };
  updateTargetPath();
  renderBanner();
}

function updateTargetPath() {
  if (!UI.targeting) return;
  const range = UI.targeting.mode === 'zap' ? 9 : 8;
  const stop = !(UI.targeting.mode === 'zap' && UI.targeting.item.type === 'bolt' && isKnown(G, UI.targeting.item));
  R.targetPath = projectilePath(G, R.target.x, R.target.y, range, stop);
}

function fireTarget() {
  const tg = UI.targeting;
  if (!tg) return;
  const { x, y } = R.target;
  if (x === G.player.x && y === G.player.y) { msg(G, 'Нельзя целиться в себя.', 'hint'); renderLog(); return; }
  cancelTargeting();
  if (tg.mode === 'zap') act(() => zapWand(G, tg.item, x, y));
  else act(() => throwItem(G, tg.item, x, y));
}

function quickFire() {
  if (UI.targeting) { fireTarget(); return; }
  const p = G.player;
  const knife = p.inv.find((o) => o.kind === 'knife');
  if (knife) { startTargeting(knife, 'throw'); return; }
  openInventory('throw');
}

// ---------- HUD и журнал ----------

function renderHUD() {
  if (!G) return;
  const p = G.player, th = THEMES[G.level.theme];
  $('depth').innerHTML = `${esc(th.name)} · <b>${G.depth}</b>`;
  $('hpfill').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
  $('hptext').textContent = `${p.hp} / ${p.maxHp}`;
  $('xpfill').style.width = `${Math.min(100, (p.xp / xpToNext(p.level)) * 100)}%`;
  $('lvl').textContent = p.level;
  const d = playerDamage(G);
  $('dmg').textContent = `${d[0]}–${d[1]}`;
  $('arm').textContent = playerArmor(G);
  $('gold').textContent = p.gold;
  // Статусы
  const s = p.status, chips = [];
  if (s.poison) chips.push(['Отравление ' + s.poison, '#7fd36a']);
  if (s.confused) chips.push(['Помутнение ' + s.confused, '#7fe0b0']);
  if (s.haste) chips.push(['Ускорение ' + s.haste, '#9fe2ff']);
  if (s.regen) chips.push(['Регенерация ' + s.regen, '#ff8fa3']);
  if (G.level.detect) chips.push(['Ясновидение', '#c9b3ff']);
  if (p.str) chips.push(['Сила +' + p.str, '#ffb347']);
  const boss = G.actors.find((a) => a.type === 'dog' && a.awake);
  if (boss) chips.push([`Древний Пёс ${boss.hp}/${boss.maxHp}`, '#ff9ab0']);
  if (UI.auto) chips.push([UI.auto.kind === 'explore' ? 'Исследую…' : 'Иду…', '#ffb347']);
  $('chips').innerHTML = chips.map(([t, c]) => `<span class="chip" style="color:${c}">${esc(t)}</span>`).join('');
  // Кнопки
  const onStairs = G.level.tiles[idx(p.x, p.y)] === T.STAIRS;
  $('act-down').classList.toggle('hot', onStairs);
  const here = itemAt(G, p.x, p.y);
  $('act-pick').classList.toggle('hot', !!here && here.kind !== 'chest');
  $('act-pick').firstChild.textContent = here && here.price ? 'Купить' : 'Взять';
  $('act-explore').classList.toggle('hot', !!UI.auto);
  $('act-explore').firstChild.textContent = UI.auto ? 'Стоп' : 'Разведка';
  const knives = p.inv.find((o) => o.kind === 'knife');
  $('act-fire').firstChild.textContent = UI.targeting ? 'Огонь!' : knives ? `Ножи ×${knives.qty}` : 'Метнуть';
  $('act-fire').classList.toggle('hot', !!UI.targeting);
}

function renderLog() {
  if (!G) return;
  const last = G.messages.slice(-4);
  const newest = G.messages.length;
  const box = $('log');
  const lastTurn = G.messages.length ? G.messages[G.messages.length - 1].turn : 0;
  box.innerHTML = last.map((m) => {
    const fresh = m.turn >= lastTurn - 0;
    return `<p class="${esc(m.cls)} ${fresh ? 'new' : 'old'}">${esc(m.text)}</p>`;
  }).join('');
  UI.lastLog = newest;
}

function renderBanner() {
  const b = $('banner');
  if (!UI.targeting) { b.hidden = true; return; }
  const a = actorAt(G, R.target.x, R.target.y);
  const what = a && a !== G.player && monsterVisible(G, a) ? MONSTERS[a.type].name : 'клетка';
  const verb = UI.targeting.mode === 'zap' ? 'Взмахнуть' : 'Бросить';
  b.hidden = false;
  b.innerHTML = `${esc(capitalize(itemName(G, UI.targeting.item)))} → ${esc(what)}
    <button id="b-fire">${verb}</button><button class="ghost" id="b-cancel">Отмена</button>`;
  $('b-fire').onclick = fireTarget;
  $('b-cancel').onclick = cancelTargeting;
}

// ---------- Описание клетки ----------

function describeTile(x, y) {
  if (!G || !inBounds(x, y)) return;
  const lv = G.level;
  if (!lv.seen[idx(x, y)]) { msg(G, 'Туда вы ещё не заглядывали.', 'hint'); renderLog(); return; }
  const a = actorAt(G, x, y);
  if (a === G.player) msg(G, `Это вы. Здоровье ${G.player.hp} из ${G.player.maxHp}.`, 'hint');
  else if (a && monsterVisible(G, a)) {
    const d = MONSTERS[a.type];
    if (a.disguised) msg(G, 'Сундук. Выглядит вполне обычно.', 'hint');
    else msg(G, `${capitalize(d.name)}${d.peaceful ? '' : ` (${a.hp}/${a.maxHp})`}${!a.awake && !d.peaceful ? ', спит' : ''}. ${d.desc}`, 'hint');
  } else {
    const it = itemAt(G, x, y);
    const tr = trapAt(G, x, y);
    if (it) msg(G, `${capitalize(itemName(G, it))}${it.price ? ` — ${it.price} мон.` : ''}. ${itemDesc(G, it)}`, 'hint');
    else if (tr && !tr.hidden) msg(G, `Ловушка: ${trapName(tr.type)}.`, 'hint');
    else {
      const names = { [T.WALL]: 'Стена.', [T.FLOOR]: 'Пол.', [T.DOOR]: 'Закрытая дверь.', [T.ODOOR]: 'Открытая дверь.', [T.STAIRS]: 'Лестница вниз.', [T.UPSTAIRS]: 'Сюда вы спустились. Назад пути нет.', [T.WATER]: 'Неглубокая вода.', [T.GRASS]: 'Высокая трава. За ней ничего не видно.', [T.BARS]: 'Решётка клетки.' };
      msg(G, names[lv.tiles[idx(x, y)]] || 'Что-то непонятное.', 'hint');
    }
  }
  renderLog();
}

// ---------- Окна ----------

function openModal(html, onReady) {
  const m = $('modal');
  m.innerHTML = html;
  m.hidden = false;
  stopAuto();
  const c = m.querySelector('.close');
  if (c) c.onclick = closeModal;
  if (onReady) onReady(m);
}
function closeModal() {
  $('modal').hidden = true;
  $('modal').innerHTML = '';
  UI.modal = null;
}

const _iconCache = new Map();
function iconURL(g, it) {
  const sprite = itemSprite(g, it), tint = itemTint(g, it);
  const key = sprite + '|' + tint;
  if (_iconCache.has(key)) return _iconCache.get(key);
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(getSprite(sprite, tint), 0, 0, 32, 32);
  const url = c.toDataURL();
  _iconCache.set(key, url);
  return url;
}

// mode: undefined — обычный рюкзак; 'throw' — что бросить; {select, scroll} — выбор цели для свитка
function openInventory(mode, selected) {
  if (!G) return;
  const p = G.player;
  let items = p.inv;
  let title = 'Рюкзак';
  let hint = '';
  if (mode === 'throw') {
    items = p.inv.filter((o) => ['knife', 'potion', 'food', 'wand'].includes(o.kind));
    title = 'Что бросить?';
    hint = items.length ? '' : 'Бросать нечего. Метательные ножи, зелья и сосиски можно найти в подземелье.';
  } else if (mode && mode.select) {
    items = mode.select === 'equip'
      ? p.inv.filter((o) => o.kind === 'weapon' || o.kind === 'armor')
      : p.inv.filter((o) => !isKnown(G, o) && o !== mode.scroll);
    title = mode.select === 'equip' ? 'Что улучшить?' : 'Что опознать?';
    hint = items.length ? '' : 'Подходящих предметов нет.';
  }
  const eq = (it) => (p.weapon === it ? 'в руке' : p.armor === it ? 'надето' : '');
  const list = items.map((it, i) => `
    <li><button data-i="${p.inv.indexOf(it)}" class="${selected === it ? 'sel' : ''}">
      <span class="key">${String.fromCharCode(97 + i)}</span>
      <img src="${iconURL(G, it)}" alt="">
      <span class="nm">${esc(capitalize(itemName(G, it)))}</span>
      <span class="tag">${eq(it)}</span>
    </button></li>`).join('');
  const W = p.weapon ? capitalize(itemName(G, p.weapon)) : 'кулаки';
  const A = p.armor ? capitalize(itemName(G, p.armor)) : 'ничего';
  let detail = '';
  if (selected && !mode) {
    const acts = itemActions(G, selected);
    detail = `<div class="detail"><h3>${esc(capitalize(itemName(G, selected)))}</h3><p>${esc(itemDesc(G, selected))}</p>
      <div class="row">${acts.map(([k, label], i) => `<button class="btn ${i ? 'ghost' : ''}" data-act="${k}">${esc(label)}<small style="opacity:.6"> ${i + 1}</small></button>`).join('')}</div></div>`;
  }
  openModal(`<div class="sheet" role="dialog" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><span style="color:var(--dim);font:13px var(--font-display)">${p.inv.length}/${INV_SIZE}</span><button class="close" aria-label="Закрыть">×</button></header>
    <div class="body">
      ${!mode ? `<div class="equip-row"><div><small>Оружие</small><b>${esc(W)}</b></div><div><small>Броня</small><b>${esc(A)}</b></div></div>` : ''}
      ${hint ? `<p class="empty">${esc(hint)}</p>` : ''}
      ${items.length ? `<ul class="inv">${list}</ul>` : !hint ? '<p class="empty">Рюкзак пуст.</p>' : ''}
      ${detail}
    </div></div>`, (m) => {
    UI.modal = { kind: 'inv', mode, items, selected };
    m.querySelectorAll('.inv button').forEach((b) => {
      b.onclick = () => pickInvItem(p.inv[Number(b.dataset.i)]);
    });
    m.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => doItemAction(selected, b.dataset.act); });
    const d = m.querySelector('.detail');
    if (d) d.scrollIntoView({ block: 'nearest' });
  });
}

function pickInvItem(it) {
  const mode = UI.modal && UI.modal.mode;
  if (mode === 'throw') {
    if (it.kind === 'wand') startTargeting(it, 'zap');
    else startTargeting(it, 'throw');
    return;
  }
  if (mode && mode.select) {
    const scroll = mode.scroll;
    closeModal();
    act(() => useItem(G, scroll, it));
    return;
  }
  openInventory(undefined, it);
}

function doItemAction(it, action) {
  playSound('click');
  switch (action) {
    case 'equip': closeModal(); act(() => equipItem(G, it)); break;
    case 'unequip': closeModal(); act(() => unequipItem(G, it)); break;
    case 'drop': closeModal(); act(() => dropFromInv(G, it)); break;
    case 'throw': startTargeting(it, 'throw'); break;
    case 'zap': startTargeting(it, 'zap'); break;
    case 'use': {
      closeModal();
      const r = act(() => useItem(G, it));
      if (r && r.select) openInventory({ select: r.select, scroll: it });
      break;
    }
  }
}

function showEnd() {
  if (!G || !G.over) return;
  const o = G.over, p = G.player;
  const won = o.won;
  const lines = won
    ? ['Барсик спасён!', `Вы выбрались из колодца с котом на руках за ${G.turn} ${plural(G.turn, 'ход', 'хода', 'ходов')}. Барсик делает вид, что так и было задумано.`]
    : ['Конец пути', `Глубина ${o.depth}. Вас одолел: ${o.cause}. Барсик всё ещё ждёт внизу.`];

        <div><small>Побеждено врагов</small><b>${G.stats.kills}</b></div>
        <div><small>Монеты</small><b>${p.gold}</b></div>

}

function addRecord() {
  const recs = JSON.parse(load(REC_KEY) || '[]');
  const o = G.over;
  recs.push({ score: o.score, won: o.won, depth: G.stats.deepest, cause: o.cause, level: G.player.level, seed: G.seed, date: Date.now() });
  recs.sort((a, b) => b.score - a.score);
  store(REC_KEY, JSON.stringify(recs.slice(0, 8)));
}

// ---------- Титульный экран ----------

function showTitle() {
  stopAuto();
  const t = $('title');
  const save = load(SAVE_KEY);
  const recs = JSON.parse(load(REC_KEY) || '[]');
  t.innerHTML = `
    <canvas id="t-cat" width="40" height="40" aria-hidden="true"></canvas>
    <h1>Кот в колодце</h1>
    <p class="sub">Барсик опять провалился в старый колодец. Внизу десять глубин: подвал, катакомбы, пещеры и логово Древнего Пса. Пошаговый рогалик: каждый спуск новый.</p>
    <div class="menu">
      ${save ? '<button class="btn" id="t-cont">Продолжить забег</button>' : ''}
      <button class="btn ${save ? 'ghost' : ''}" id="t-new">Новая игра</button>
      <button class="btn ghost" id="t-daily">Забег дня · ${esc(todayLabel())}</button>
      <button class="btn ghost" id="t-help">Как играть</button>
    </div>
    <div class="seed"><label for="t-seed">Сид (необязательно):</label><input id="t-seed" inputmode="numeric" placeholder="случайный"></div>
    ${recs.length ? `<div class="records"><h3>Лучшие забеги</h3><ol>${recs.map((r) => `<li><b>${r.score}</b><span>${r.won ? 'Барсик спасён' : `глубина ${r.depth}, ${esc(r.cause || '')}`}</span><span style="flex:none">ур ${r.level}</span></li>`).join('')}</ol></div>` : ''}`;
  t.hidden = false;
  if ($('t-cont')) $('t-cont').onclick = () => {
    try { G = deserializeGame(save); R.mapKey = ''; R.anim.clear(); R.cam.init = false; hideTitle(); afterAction(true); }
    catch (e) { store(SAVE_KEY, null); startNewGame(); }
  };
  $('t-new').onclick = () => {
    audioInit();
    const v = $('t-seed').value.trim();
    startNewGame(v && /^\d+$/.test(v) ? Number(v) : undefined);
  };
  $('t-help').onclick = () => showHelp();
  $('t-daily').onclick = () => { audioInit(); startNewGame(dailySeed()); };
  animateTitleCat();
}

// Сид дня одинаков у всех, кто играет в этот день
function dailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function todayLabel() {
  const m = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const d = new Date();
  return `${d.getDate()} ${m[d.getMonth()]}`;
}

function hideTitle() { $('title').hidden = true; }

function animateTitleCat() {
  const c = $('t-cat');
  if (!c) return;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const draw = (t) => {
    if (!document.body.contains(c) || $('title').hidden) return;
    ctx.clearRect(0, 0, 40, 40);
    // Колодец: тёмный круг и каменный обод
    ctx.fillStyle = '#05040a';
    ctx.beginPath(); ctx.ellipse(20, 26, 17, 9, 0, 0, Math.PI * 2); ctx.fill();
    const bob = Math.round(Math.sin(t / 400) * 1.5);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, 40, 27); ctx.clip();
    ctx.drawImage(getSprite('cat'), 12, 12 + bob, 16, 16);
    ctx.restore();
    for (let i = 0; i < 12; i++) {
      const a = Math.PI + (i / 11) * Math.PI;
      const x = 20 + Math.cos(a) * 18, y = 26 + Math.sin(a) * 9;
      ctx.fillStyle = i % 2 ? '#6b4a3a' : '#8a6450';
      ctx.fillRect(Math.round(x) - 2, Math.round(y) - 1, 4, 3);
    }
    ctx.fillStyle = '#6b4a3a'; ctx.fillRect(2, 26, 36, 4);
    ctx.fillStyle = '#8a6450'; ctx.fillRect(2, 26, 36, 1);
    for (let x = 4; x < 38; x += 6) { ctx.fillStyle = '#4a3026'; ctx.fillRect(x, 27, 1, 3); }
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

// ---------- Ввод ----------

const KEYMAP = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  k: [0, -1], j: [0, 1], h: [-1, 0], l: [1, 0], y: [-1, -1], u: [1, -1], b: [-1, 1], n: [1, 1],
  w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], q: [-1, -1], e: [1, -1], z: [-1, 1], c: [1, 1],
  8: [0, -1], 2: [0, 1], 4: [-1, 0], 6: [1, 0], 7: [-1, -1], 9: [1, -1], 1: [-1, 1], 3: [1, 1],
  Home: [-1, -1], PageUp: [1, -1], End: [-1, 1], PageDown: [1, 1],
};

function onKey(e) {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  // Окна
  if (!$('title').hidden) {
    if (e.key === 'Enter' && $('modal').hidden) { const b = $('t-cont') || $('t-new'); if (b) { b.click(); e.preventDefault(); } }
    if (e.key === 'Escape' && !$('modal').hidden) closeModal();
    return;
  }
  if (!$('modal').hidden) {
    if (e.key === 'Escape') { if (UI.modal && UI.modal.selected) openInventory(); else closeModal(); e.preventDefault(); return; }
    if (UI.modal && UI.modal.kind === 'inv') {
      if (/^[a-r]$/.test(key) && !UI.modal.selected) {
        const it = UI.modal.items[key.charCodeAt(0) - 97];
        if (it) pickInvItem(it);
        e.preventDefault();
      } else if (/^[1-9]$/.test(key) && UI.modal.selected) {
        const acts = itemActions(G, UI.modal.selected);
        const a = acts[Number(key) - 1];
        if (a) doItemAction(UI.modal.selected, a[0]);
        e.preventDefault();
      } else if (key === 'i') closeModal();
    }
    return;
  }
  if (UI.targeting) {
    if (e.key === 'Escape') { cancelTargeting(); e.preventDefault(); return; }
    if (e.key === 'Enter' || key === 'f' || key === 't') { fireTarget(); e.preventDefault(); return; }
    if (e.key === 'Tab') { cycleTarget(); e.preventDefault(); return; }
  }
  if (KEYMAP[key] && !(e.shiftKey && key.length === 1 && !/[a-z]/.test(key))) {
    e.preventDefault();
    const [dx, dy] = KEYMAP[key];
    move(dx, dy);
    return;
  }
  switch (key) {
    case ' ': case '.': case '5': case 'Clear': e.preventDefault(); move(0, 0); break;
    case 'g': case ',': doPickup(); break;
    case '>': case 'Enter': doDescend(); break;
    case 'i': stopAuto(); openInventory(); break;
    case 'x': if (UI.auto) stopAuto(); else startAuto('explore'); break;
    case 'f': case 't': quickFire(); break;
    case 'm': toggleMini(); break;
    case '?': case '/': showHelp(); break;
    case 'Escape': if (UI.auto) stopAuto(); else showMenu(); break;
  }
}

function toggleMini() {
  $('mini').hidden = !$('mini').hidden;
  saveSettings();
}

function saveSettings() { store(SET_KEY, JSON.stringify({ sound: AUDIO.on, mini: !$('mini').hidden })); }
function syncSoundBtn() { $('btn-sound').setAttribute('aria-pressed', String(AUDIO.on)); }

function onTapTile(tx, ty) {
  if (!G || G.over) return;
  if (UI.targeting) {
    if (R.target && R.target.x === tx && R.target.y === ty) fireTarget();
    else { R.target = { x: tx, y: ty }; updateTargetPath(); renderBanner(); }
    return;
  }
  const p = G.player;
  const dx = tx - p.x, dy = ty - p.y;
  if (dx === 0 && dy === 0) {
    const it = itemAt(G, p.x, p.y);
    if (it && it.kind !== 'chest') doPickup();
    else if (G.level.tiles[idx(p.x, p.y)] === T.STAIRS) doDescend();
    else move(0, 0);
    return;
  }
  if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) { move(dx, dy); return; }
  if (!inBounds(tx, ty) || !G.level.seen[idx(tx, ty)]) return;
  if (!isPassableTile(G.level.tiles[idx(tx, ty)]) && !actorAt(G, tx, ty)) {
    // Тап по стене — идём к ближайшей проходимой клетке рядом
    return;
  }
  startAuto('travel', { x: tx, y: ty });
}

function bindInput() {
  window.addEventListener('keydown', onKey);
  const view = $('view');
  let down = null;
  view.addEventListener('pointerdown', (e) => {
    audioInit();
    down = { x: e.clientX, y: e.clientY, t: performance.now(), long: false };
    clearTimeout(UI.longPress);
    if (e.pointerType !== 'mouse') {
      UI.longPress = setTimeout(() => {
        if (!down) return;
        down.long = true;
        const t = screenToTile(down.x, down.y);
        describeTile(t.x, t.y);
        if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) { /* нет вибрации */ }
      }, 450);
    }
  });
  view.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') R.hover = screenToTile(e.clientX, e.clientY);
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) { clearTimeout(UI.longPress); }
  });
  view.addEventListener('pointerleave', () => { R.hover = null; });
  view.addEventListener('pointerup', (e) => {
    clearTimeout(UI.longPress);
    if (!down) return;
    const wasLong = down.long;
    down = null;
    if (wasLong || e.button === 2) return;
    if (!$('modal').hidden || !$('title').hidden) return;
    const t = screenToTile(e.clientX, e.clientY);
    if (UI.auto) { stopAuto(); return; }
    onTapTile(t.x, t.y);
  });
  view.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const t = screenToTile(e.clientX, e.clientY);
    describeTile(t.x, t.y);
  });
  // D-pad с автоповтором при удержании
  document.querySelectorAll('#dpad button').forEach((b) => {
    let rep = null;
    const [dx, dy] = b.dataset.d.split(',').map(Number);
    const fire = () => move(dx, dy);
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      audioInit();
      fire();
      clearInterval(rep);
      rep = setTimeout(() => { rep = setInterval(fire, 120); }, 320);
    });
    const stop = () => { clearTimeout(rep); clearInterval(rep); rep = null; };
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointerleave', stop);
    b.addEventListener('pointercancel', stop);
  });
  $('act-explore').onclick = () => { if (UI.auto) stopAuto(); else startAuto('explore'); };
  $('act-pick').onclick = doPickup;
  $('act-down').onclick = doDescend;
  $('act-inv').onclick = () => { stopAuto(); openInventory(); };
  $('act-fire').onclick = quickFire;
  $('act-wait').onclick = () => move(0, 0);
  $('btn-sound').onclick = () => { AUDIO.on = !AUDIO.on; audioInit(); syncSoundBtn(); saveSettings(); };
  $('btn-help').onclick = showHelp;
  $('btn-menu').onclick = showMenu;
  $('mini').onclick = toggleMini;
  $('modal').addEventListener('pointerdown', (e) => { if (e.target === $('modal') && (!G || !G.over)) closeModal(); });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resizeRenderer()).observe($('stage'));
}

(function start() {
  const go = () => {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();
